<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#030711"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfd2"/>
      <stop offset="100%" stop-color="#12c89b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f36"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Background grid pattern -->
  <g stroke="#00bfd2" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="360" height="36" rx="18" fill="#09182a" stroke="#00bfd2" stroke-width="1.5"/>
  <text x="60" y="53" fill="#00bfd2" font-family="'Orbitron', sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">SECURE LAN &amp; FIREWALL TOPOLOGY</text>

  <!-- Left: WAN / Internet Source -->
  <rect x="40" y="190" width="130" height="150" rx="14" fill="url(#cardGrad)" stroke="#19334a" stroke-width="2"/>
  <circle cx="105" cy="245" r="32" fill="#0b1b2d" stroke="#00bfd2" stroke-width="2"/>
  <text x="105" y="240" fill="#00bfd2" font-family="'Orbitron', sans-serif" font-size="20" text-anchor="middle">🌐</text>
  <text x="105" y="260" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" text-anchor="middle">WAN / ISP</text>
  <text x="105" y="295" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="12" text-anchor="middle">Public Gateway</text>
  <text x="105" y="315" fill="#00bfd2" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="12" text-anchor="middle">203.0.113.1</text>

  <!-- WAN to Firewall Connection line -->
  <line x1="170" y1="265" x2="260" y2="265" stroke="#00bfd2" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="255,260 265,265 255,270" fill="#00bfd2"/>

  <!-- Center Shield: Firewall / Gateway -->
  <g transform="translate(260, 130)">
    <rect width="210" height="270" rx="16" fill="url(#cardGrad)" stroke="#00bfd2" stroke-width="2" filter="url(#glowCyan)"/>
    <path d="M105 40 L160 65 V130 Q160 185 105 210 Q50 185 50 130 V65 Z" fill="#081728" stroke="url(#shieldGrad)" stroke-width="3"/>
    <text x="105" y="115" fill="#12c89b" font-family="'Orbitron', sans-serif" font-size="34" text-anchor="middle">🛡️</text>
    <text x="105" y="155" fill="#ffffff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="14" text-anchor="middle">FIREWALL</text>
    <text x="105" y="175" fill="#00bfd2" font-family="'Orbitron', sans-serif" font-weight="600" font-size="11" text-anchor="middle">ROUTER / NAT</text>
    <rect x="25" y="225" width="160" height="28" rx="6" fill="#05101c" stroke="#12c89b" stroke-width="1"/>
    <text x="105" y="243" fill="#12c89b" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" text-anchor="middle">GW: 192.168.1.1 (LAN)</text>
  </g>

  <!-- Connection from Firewall to Switch -->
  <line x1="470" y1="265" x2="540" y2="265" stroke="#12c89b" stroke-width="3"/>
  <polygon points="535,260 545,265 535,270" fill="#12c89b"/>

  <!-- Managed Switch -->
  <g transform="translate(540, 195)">
    <rect width="130" height="140" rx="14" fill="url(#cardGrad)" stroke="#12c89b" stroke-width="2"/>
    <text x="65" y="40" fill="#00bfd2" font-family="'Orbitron', sans-serif" font-size="24" text-anchor="middle">🔀</text>
    <text x="65" y="65" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CORE SWITCH</text>
    <rect x="20" y="80" width="90" height="20" rx="4" fill="#060e1b" stroke="#19334a"/>
    <circle cx="35" cy="90" r="3" fill="#12c89b"/>
    <circle cx="47" cy="90" r="3" fill="#12c89b"/>
    <circle cx="59" cy="90" r="3" fill="#12c89b"/>
    <circle cx="71" cy="90" r="3" fill="#12c89b"/>
    <circle cx="83" cy="90" r="3" fill="#12c89b"/>
    <text x="65" y="122" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11" text-anchor="middle">Gigabit LAN</text>
  </g>

  <!-- Distribution Lines from Switch to Devices -->
  <path d="M670 240 Q710 240 730 140 H760" fill="none" stroke="#00bfd2" stroke-width="2.5"/>
  <path d="M670 265 H760" fill="none" stroke="#12c89b" stroke-width="2.5"/>
  <path d="M670 290 Q710 290 730 390 H760" fill="none" stroke="#00bfd2" stroke-width="2.5"/>

  <!-- Device 1: Workstation PC (DHCP Lease) -->
  <g transform="translate(760, 95)">
    <rect width="165" height="90" rx="10" fill="url(#cardGrad)" stroke="#19334a" stroke-width="1.5"/>
    <text x="25" y="35" fill="#00bfd2" font-size="18">💻</text>
    <text x="50" y="32" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11">WORKSTATION</text>
    <text x="50" y="48" fill="#12c89b" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="12">192.168.1.101</text>
    <rect x="15" y="60" width="135" height="20" rx="4" fill="#060e1b"/>
    <text x="82" y="74" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11" text-anchor="middle">DHCP Dynamic Pool</text>
  </g>

  <!-- Device 2: Wi-Fi 6 AP & Mobile Devices -->
  <g transform="translate(760, 220)">
    <rect width="165" height="90" rx="10" fill="url(#cardGrad)" stroke="#12c89b" stroke-width="1.5"/>
    <text x="25" y="35" fill="#12c89b" font-size="18">📶</text>
    <text x="50" y="32" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11">WIFI 6 AP / WPA3</text>
    <text x="50" y="48" fill="#12c89b" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="12">192.168.1.50</text>
    <rect x="15" y="60" width="135" height="20" rx="4" fill="#060e1b"/>
    <text x="82" y="74" fill="#00bfd2" font-family="'Rajdhani', sans-serif" font-size="11" text-anchor="middle">Isolated Guest VLAN</text>
  </g>

  <!-- Device 3: Network Printer (Static Reservation) -->
  <g transform="translate(760, 345)">
    <rect width="165" height="90" rx="10" fill="url(#cardGrad)" stroke="#19334a" stroke-width="1.5"/>
    <text x="25" y="35" fill="#00bfd2" font-size="18">🖨️</text>
    <text x="50" y="32" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11">LAN PRINTER</text>
    <text x="50" y="48" fill="#12c89b" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="12">192.168.1.20</text>
    <rect x="15" y="60" width="135" height="20" rx="4" fill="#060e1b"/>
    <text x="82" y="74" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11" text-anchor="middle">Static MAC Reserved</text>
  </g>

  <!-- Bottom Badges / Rules Checklist -->
  <g transform="translate(40, 460)">
    <rect width="210" height="48" rx="8" fill="#091524" stroke="#12c89b" stroke-width="1"/>
    <text x="20" y="28" fill="#12c89b" font-size="16">✓</text>
    <text x="40" y="23" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="10">DEFAULT PASSWORDS</text>
    <text x="40" y="38" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11">Changed to Unique Strong Key</text>
  </g>
  <g transform="translate(265, 460)">
    <rect width="210" height="48" rx="8" fill="#091524" stroke="#12c89b" stroke-width="1"/>
    <text x="20" y="28" fill="#12c89b" font-size="16">✓</text>
    <text x="40" y="23" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="10">DHCP NO OVERLAP</text>
    <text x="40" y="38" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11">Pool: .100–.199 | Static: .2–.99</text>
  </g>
  <g transform="translate(490, 460)">
    <rect width="210" height="48" rx="8" fill="#091524" stroke="#12c89b" stroke-width="1"/>
    <text x="20" y="28" fill="#12c89b" font-size="16">✓</text>
    <text x="40" y="23" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="10">WPA3-AES ENCRYPTION</text>
    <text x="40" y="38" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11">Firmware Updated &amp; Hardened</text>
  </g>
  <g transform="translate(715, 460)">
    <rect width="210" height="48" rx="8" fill="#091524" stroke="#12c89b" stroke-width="1"/>
    <text x="20" y="28" fill="#12c89b" font-size="16">✓</text>
    <text x="40" y="23" fill="#e9f4ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="10">ROLLBACK BACKUP</text>
    <text x="40" y="38" fill="#647d9f" font-family="'Rajdhani', sans-serif" font-size="11">Configuration Recorded Before</text>
  </g>
</svg>
